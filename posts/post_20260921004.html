const mdContent = `# 技术对比：EMQX vs Mosquitto vs HiveMQ，企业级 MQTT Broker 如何选型？

## 一句话总结

- **Mosquitto**：轻量、免费、适合原型验证和小规模部署（< 1000 设备）
- **EMQX**：国产开源，功能全面，中大规模首选，社区版免费，企业版付费
- **HiveMQ**：德国品牌，工业级认证支持好，汽车/医疗场景合规需求强，全付费

## 详细对比矩阵

| 维度 | Mosquitto | EMQX 社区版 | HiveMQ 企业版 |
| :--- | :--- | :--- | :--- |
| **最大并发连接** | 约 10 万（单机） | 100 万+（集群） | 数百万（集群） |
| **集群支持** | 无（需手动负载均衡） | ✅ 内置集群，无缝扩展 | ✅ 商业级集群 |
| **规则引擎** | ❌ 无 | ✅ SQL 规则引擎，支持数据转发 | ✅ 丰富但需付费 |
| **Web 管理界面** | ❌ 无 | ✅ Dashboard 功能完善 | ✅ 非常完善 |
| **TLS/mTLS** | ✅ 支持 | ✅ 支持 | ✅ 支持 |
| **OPC-UA 桥接** | ❌ | ✅（企业版） | ✅ |
| **许可证费用** | 完全免费（EPL 2.0） | 社区版免费，企业版付费 | 全部付费 |
| **中文支持** | 社区一般 | ✅ 中文文档完善，国内社区活跃 | ❌ 英文为主 |

## 码视野推荐选型路径

\`\`\`
设备数 < 500  →  Mosquitto（快速启动，零成本）
设备数 500~10万 →  EMQX 社区版（功能丰富，中文友好）
设备数 > 10万 或有工业认证需求  →  EMQX 企业版 / HiveMQ
\`\`\`

如需具体选型咨询，欢迎联系码视野（📞 **19065223505**），我们提供免费的平台选型评估服务。`;
mermaid.initialize({startOnLoad:false,theme:'default'});
async function render() {
  const container = document.getElementById('content-body');
  // 提取 mermaid 代码块
  const mermaidBlocks = [];
  const processedMd = mdContent.replace(/```mermaid
([\s\S]*?)```/g, (_, code) => {
    const id = 'mermaid-' + mermaidBlocks.length;
    mermaidBlocks.push({id, code: code.trim()});
    return `<div class="mermaid-placeholder" data-id="${id}"></div>`;
  });
  container.innerHTML = marked.parse(processedMd);
  // 渲染 mermaid
  for(const {id, code} of mermaidBlocks) {
    const placeholder = container.querySelector(`[data-id="${id}"]`);
    if(placeholder) {
      const div = document.createElement('div');
      div.className = 'mermaid';
      div.textContent = code;
      placeholder.replaceWith(div);
    }
  }
  await mermaid.run();
}
render();
